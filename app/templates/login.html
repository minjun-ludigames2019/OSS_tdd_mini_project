<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>RPG 게임 - 로그인</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
        .box { border: 1px solid #ccc; padding: 20px; width: 300px; margin: 0 auto; border-radius: 10px; }
        input { margin: 5px 0; padding: 8px; width: 90%; }
        button { margin-top: 10px; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>⚔️ RPG 게임 🛡️</h2>
        <input type="text" id="username" placeholder="아이디" required>
        <input type="password" id="password" placeholder="비밀번호" required>
        <br>
        <button onclick="auth('/api/login')">로그인</button>
        <button onclick="auth('/api/register')">회원가입</button>
        <p id="msg"></p>
    </div>

    <script>
        async function auth(endpoint) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.msg);
                if (endpoint === '/api/login') window.location.href = '/'; // 로그인 성공 시 메인으로
            } else {
                document.getElementById('msg').innerText = data.error || data.msg;
                document.getElementById('msg').style.color = 'red';
            }
        }
    </script>
</body>
</html>
